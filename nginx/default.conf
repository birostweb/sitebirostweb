# ============================================================
#  birostweb.fr — configuration nginx durcie (site statique)
#  Image de base : nginxinc/nginx-unprivileged (tourne en non-root, port 8080)
#  TLS/HTTPS est géré en amont par Traefik (Dokploy) — ce conteneur ne sert
#  que du HTTP en interne.
# ============================================================

# Ne pas divulguer la version de nginx
server_tokens off;

# Compression
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain text/css text/xml
    application/javascript application/json application/xml
    image/svg+xml font/woff2;

# Limiter la surface d'attaque
client_max_body_size 1m;
client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 10s;

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # --- N'autoriser que les méthodes de lecture ---
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # ============================================================
    #  En-têtes de sécurité (appliqués à toutes les réponses)
    #  Note : on n'utilise PAS add_header dans les blocs location
    #  (seulement `expires`) pour ne pas écraser ces en-têtes hérités.
    # ============================================================

    # HTTPS strict : forcer HTTPS pendant 2 ans, sous-domaines inclus.
    # (Retirer "preload" tant que tu n'as pas soumis le domaine à hstspreload.org)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Anti-clickjacking (doublé par frame-ancestors dans la CSP)
    add_header X-Frame-Options "DENY" always;

    # Empêche le navigateur de "deviner" les types MIME
    add_header X-Content-Type-Options "nosniff" always;

    # Ne fuiter l'URL de provenance que vers la même origine
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Désactive toutes les API sensibles dont le site n'a pas besoin
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), interest-cohort=()" always;

    # Isolation d'origine
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Content-Security-Policy
    #  - script-src verrouillé par le hash du <script> inline (pas de 'unsafe-inline')
    #  - style-src autorise l'inline (feuille <style> + attributs style="")
    #  - tout le reste en 'self', aucune ressource externe
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self' 'sha256-TBX/CpGR+A0QyncNQXT4dG3PsF1/uY3uM5KWk0EPgvs='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; manifest-src 'self'; upgrade-insecure-requests" always;

    # ============================================================
    #  Fichiers / routage
    # ============================================================

    # Bloquer les fichiers cachés (.git, .env, etc.) SAUF /.well-known/
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # security.txt
    location ^~ /.well-known/ {
        allow all;
    }

    # Polices : cache long (contenu immuable et versionné par nom)
    location /fonts/ {
        expires 1y;
        access_log off;
    }

    # Assets images / og-image
    location ~* \.(png|jpe?g|gif|webp|svg|ico)$ {
        expires 30d;
        access_log off;
    }

    # robots / sitemap : cache court
    location ~* \.(xml|txt)$ {
        expires 1h;
    }

    # HTML : jamais mis en cache (déploiements immédiats)
    location = / {
        expires -1;
        try_files /index.html =404;
    }
    location = /index.html {
        expires -1;
    }

    # Routage général
    location / {
        try_files $uri $uri/ =404;
    }

    # Pages d'erreur : renvoyer l'accueil pour une nav propre
    error_page 403 404 =404 /index.html;

    # Healthcheck simple pour Docker/Dokploy
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
